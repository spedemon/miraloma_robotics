name: Build Mira

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 0.1.0)
        required: false
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install platformio
      - name: Build all firmware and release manifests
        run: python robot_arms/web_app/scripts/build_all.py --firmware-only
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-firmware
          path: |
            robot_arms/web_app/firmware/*.bin
            robot_arms/web_app/firmware/manifest.json
            robot_arms/web_app/firmware/mira-firmware-manifest.json

  macos:
    needs: firmware
    runs-on: macos-latest
    defaults:
      run:
        working-directory: robot_arms/web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: Mira-firmware
          path: robot_arms/web_app/firmware
      - name: Set release version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "MIRA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MIRA_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - name: Build unsigned macOS disk image
        run: python scripts/build_all.py --app-only --version "$MIRA_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-macOS
          path: robot_arms/web_app/dist/Mira-*-macOS-*.dmg

  windows:
    needs: firmware
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robot_arms/web_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: Mira-firmware
          path: robot_arms/web_app/firmware
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Set release version
        shell: powershell
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $Version = "${{ github.ref_name }}".TrimStart('v')
            "MIRA_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "MIRA_VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
      - name: Build unsigned Windows installer
        shell: powershell
        run: python scripts/build_all.py --app-only --version $env:MIRA_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-Windows
          path: robot_arms/web_app/dist/Mira-Setup-*.exe

  android:
    needs: firmware
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_RELEASE_KEY: ${{ secrets.MIRA_ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: robot_arms/android_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Android release key
        if: env.HAS_ANDROID_RELEASE_KEY == 'true'
        env:
          MIRA_ANDROID_KEYSTORE_BASE64: ${{ secrets.MIRA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$MIRA_ANDROID_KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$MIRA_ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/mira-release.jks
      - name: Set release version
        if: env.HAS_ANDROID_RELEASE_KEY == 'true'
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "MIRA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MIRA_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          fi
      - name: Build signed Android application
        if: env.HAS_ANDROID_RELEASE_KEY == 'true'
        env:
          MIRA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MIRA_ANDROID_KEYSTORE_PASSWORD }}
          MIRA_ANDROID_KEY_PASSWORD: ${{ secrets.MIRA_ANDROID_KEY_PASSWORD }}
          MIRA_ANDROID_KEY_ALIAS: ${{ secrets.MIRA_ANDROID_KEY_ALIAS }}
        run: ./scripts/build_release.sh "$MIRA_VERSION"
      - uses: actions/upload-artifact@v4
        if: env.HAS_ANDROID_RELEASE_KEY == 'true'
        with:
          name: Mira-Android
          path: robot_arms/android_app/dist/Mira-*-Android.apk

  release:
    if: github.ref_type == 'tag'
    needs: [firmware, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --verify-tag
          fi
          shopt -s nullglob
          assets=(
            release-assets/mira-firmware-manifest.json
            release-assets/*.bin
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.apk
          )
          gh release upload "${{ github.ref_name }}" "${assets[@]}" \
            --repo "${{ github.repository }}" --clobber
