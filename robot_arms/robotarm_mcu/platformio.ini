; Mira Motor MCU — PlatformIO Configuration
; Board: ESP32-C3 Super Mini

[env:esp32c3]
; Pin the Arduino 3.x-compatible pioarduino platform used by Mira. The
; PlatformIO registry package currently resolves to Arduino 2.x and cannot
; compile the LEDC and ESP-NOW APIs used by this firmware.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = lolin_c3_mini
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200

; Enable native USB CDC serial on ESP32-C3
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -include include/nimble_config_override.h
    -I include

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    h2zero/NimBLE-Arduino@2.5.1
